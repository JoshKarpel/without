[project]
name = "without-workspace"
version = "0.0.0"
description = "Workspace root for without: a sans-IO narrow-waist contract for composing stateful stream processors, so independently-written pieces snap together."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Josh Karpel", email = "josh.karpel@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "without-core",
    "without-env",
    "without-configmap",
    "without-asgi",
    "without-http",
    "without-web",
    "without-dag",
    "without-logging",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
without-core = { workspace = true }
without-env = { workspace = true }
without-configmap = { workspace = true }
without-asgi = { workspace = true }
without-http = { workspace = true }
without-web = { workspace = true }
without-dag = { workspace = true }
without-logging = { workspace = true }
integration = { workspace = true }

[dependency-groups]
dev = [
    "integration",
    "cogapp>=3.4",
    "pre-commit>=4.4",
    "pytest<10",
    "pytest-cov>=3",
    "pytest-durations>=1",
    "pytest-xdist>=3",
    "pytest-asyncio>=1",
    "pytest-mock>=3",
    "pytest-randomly>=3",
    "pytest-timeout>=2.3",
    "trustme>=1.1",
    "hypothesis>=6.155.7",
    "mypy>=1",
    "ruff>=0.15.20",
    "types-pyyaml>=6",
    "uvloop>=0.22.1 ; sys_platform != 'win32'",  # uvloop has no Windows support; the suite runs asyncio-only there
]
docs = [
    # MkDocs 2.0 is a backward-incompatible rewrite that drops the plugin system
    # this site relies on (mkdocstrings, the hook), so cap below it deliberately.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.pytest.ini_options]
addopts = [
    "-q",
    "-n", "auto",
    "--dist", "worksteal",
    "--strict-markers",
    # Off by default, like pytest's own --durations: opt in with `just durations`
    # (or `--pytest-durations=N`) when profiling the suite, so routine runs stay quiet.
    "--pytest-durations", "0",
]
testpaths = ["packages/**/tests"]

# A global per-test timeout so a deadlocked async test (e.g. a server that never
# replies) fails loudly instead of hanging the suite. `thread` works without
# signals, so it is xdist-safe.
timeout = 30
timeout_method = "thread"

markers = ["slow"]

# Turn warnings into failures, then carve out narrow exceptions. Later entries win,
# so the `ignore` overrides the blanket `error` for the one case it matches.
filterwarnings = [
    "error",
    # uvloop's `run_in_executor` calls the deprecated `asyncio.iscoroutinefunction`
    # (stdlib, slated for removal in 3.16), so any test that hits `asyncio.to_thread`
    # under the uvloop loop would otherwise fail. This is uvloop's call to make, not ours.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # pytest-durations still reads the pytest-10-deprecated `FixtureDef.has_location`
    # to key its fixture measurements. Its timing report is a dev tool, not production
    # behaviour, so ignore its deprecation rather than let it fail the suite.
    "ignore:FixtureDef.has_location is deprecated:pytest.PytestRemovedIn10Warning",
]

asyncio_mode = "auto"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
fail_under = 100
exclude_also = [
    "assert_never\\(",
    "case _ as unreachable:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.mypy]
pretty = true
show_error_codes = true

files = ["."]
exclude = ["site/"]

check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
disallow_any_generics = true

warn_unused_configs = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_redundant_casts = true

ignore_missing_imports = true

plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A",     # https://docs.astral.sh/ruff/rules/#flake8-builtins-a
    "ASYNC", # https://docs.astral.sh/ruff/rules/#flake8-async-async
    "B",     # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "BLE",   # https://docs.astral.sh/ruff/rules/#flake8-blind-except-ble
    "C4",    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "D",     # https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "DTZ",   # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
    "E",     # https://docs.astral.sh/ruff/rules/#error-e
    "F",     # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "FA",    # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
    "FLY",   # https://docs.astral.sh/ruff/rules/#flynt-fly
    "FURB",  # https://docs.astral.sh/ruff/rules/#refurb-furb
    "G",     # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
    "I",     # https://docs.astral.sh/ruff/rules/#isort-i
    "ICN",   # https://docs.astral.sh/ruff/rules/#flake8-import-conventions-icn
    "LOG",   # https://docs.astral.sh/ruff/rules/#flake8-logging-log
    "N",     # https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "PERF",  # https://docs.astral.sh/ruff/rules/#perflint-perf
    "PGH",   # https://docs.astral.sh/ruff/rules/#pygrep-hooks-pgh
    "PIE",   # https://docs.astral.sh/ruff/rules/#flake8-pie-pie
    "PLC",   # https://docs.astral.sh/ruff/rules/#convention-plc
    "PLE",   # https://docs.astral.sh/ruff/rules/#error-ple
    "PLW",   # https://docs.astral.sh/ruff/rules/#warning-plw
    "PT",    # https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
    "PTH",   # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "PYI",   # https://docs.astral.sh/ruff/rules/#flake8-pyi-pyi
    "RET",   # https://docs.astral.sh/ruff/rules/#flake8-return-ret
    "RSE",   # https://docs.astral.sh/ruff/rules/#flake8-raise-rse
    "RUF",   # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "SIM",   # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
    "SLF",   # https://docs.astral.sh/ruff/rules/#flake8-self-slf
    "T10",   # https://docs.astral.sh/ruff/rules/#flake8-debugger-t10
    "T20",   # https://docs.astral.sh/ruff/rules/#flake8-print-t20
    "TID",   # https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
    "UP",    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "W",     # https://docs.astral.sh/ruff/rules/#warning-w
]

ignore = [
    "E501",  # line length exceeds limit
    "E741",  # ambiguous variable name
    "T201",  # print
    "T203",  # pprint
    "N818",  # exception names are deliberately descriptive (ClientDisconnect, TodoNotFound), not Error-suffixed
    "G004",  # logging-f-string: f-strings are the house style for all formatting, including logging calls
    # pydocstyle: enforce well-formed docstrings, but don't mandate their presence or dictate mood.
    "D1",    # undocumented-*: docstrings are written where they add value (and never on modules, per house style)
    "D203",  # incompatible with D211 (no blank line before a class docstring)
    "D205",  # would force a single-physical-line summary; summary sentences here wrap naturally over a few lines
    "D212",  # incompatible with D213 (the multi-line summary belongs on the second line)
    "D401",  # non-imperative-mood: docstrings here are descriptive ("Whether ...", "A ... paired with ...")
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "SLF001",   # tests inspect private internals deliberately (white-box connection-pool checks)
    "ASYNC110", # tests poll observed state (in_flight, started counts) with sleep loops; no Event to await
    "SIM117",   # nested `with` expresses resource scoping (server > pool > request); flattening moves scoped asserts
]
