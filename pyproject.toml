[project]
name = "without-workspace"
version = "0.0.0"
description = "Workspace root for without: a sans-IO narrow-waist interface for composing stateful stream processors, so independently-written pieces snap together."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Josh Karpel", email = "josh.karpel@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "without-core",
    "without-env",
    "without-configmap",
    "without-asgi",
    "without-http",
    "without-web",
    "without-dag",
    "without-durability",
    "without-durability-redis",
    "without-durability-postgres",
    "without-durability-sqlite",
    "without-logging",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
without-core = { workspace = true }
without-env = { workspace = true }
without-configmap = { workspace = true }
without-asgi = { workspace = true }
without-http = { workspace = true }
without-web = { workspace = true }
without-dag = { workspace = true }
without-durability = { workspace = true }
without-durability-redis = { workspace = true }
without-durability-postgres = { workspace = true }
without-durability-sqlite = { workspace = true }
without-logging = { workspace = true }
integration = { workspace = true }
benchmarks = { workspace = true }

[dependency-groups]
dev = [
    "integration",
    "benchmarks",
    "cogapp>=3.4",
    "pre-commit>=4.6.1",
    "pytest<10",
    "pytest-cov>=3",
    "pytest-durations>=1.7.0",
    "pytest-xdist>=3",
    "pytest-asyncio>=1",
    "pytest-mock>=3",
    "pytest-randomly>=3",
    "pytest-timeout>=2.3",
    # Runs the services in compose.yaml around the suite when docker is not the engine (see the
    # `test` recipe). It is a Python package, so the toolchain that pins everything else pins it
    # too; the engines themselves are not, so each stays a system install (`apt install podman`,
    # `brew install podman`, `winget install podman`, or docker by its own instructions).
    "podman-compose>=1.6",
    "trustme>=1.1",
    "hypothesis>=6.161.2",
    "mutmut>=3",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20260724",
    "uvloop>=0.22.1 ; sys_platform != 'win32'",  # uvloop has no Windows support; the suite runs asyncio-only there
]
docs = [
    # MkDocs 2.0 is a backward-incompatible rewrite that drops the plugin system
    # this site relies on (mkdocstrings, the hook), so cap below it deliberately.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.pytest.ini_options]
addopts = [
    "-q",
    "-n", "auto",
    "--dist", "worksteal",
    "--strict-markers",
    # Off by default, like pytest's own --durations: opt in with `just durations`
    # (or `--pytest-durations=N`) when profiling the suite, so routine runs stay quiet.
    "--pytest-durations", "0",
]
testpaths = ["packages/**/tests"]

# A global per-test timeout so a deadlocked async test (e.g. a server that never
# replies) fails loudly instead of hanging the suite. `thread` works without
# signals, so it is xdist-safe.
#
# The bound is deliberately tight. A deadlock is the *expected* way to fail here, so
# the budget is what waiting on one costs, and a mutation run stalls the scheduler on
# purpose over and over: the without-dag run spent longer waiting out a 30-second
# budget than running every other mutant. Five seconds is roughly five times the
# slowest test in the suite (`just durations` reports it: one that waits a deliberate
# one-second `wait_for` to prove a socket buffer fills) and sixteen times the next.
# Raise it per-test with `@pytest.mark.timeout(...)` rather than globally.
timeout = 5
timeout_method = "thread"

markers = [
    "slow",
    # For a test that drives one of the services in compose.yaml. `just test` starts them and
    # passes each address through the environment; a marked test skips when its service is
    # unset, and `-m "not compose"` deselects them all up front.
    "compose: drives a real service from compose.yaml, started by the `test` recipe",
    # Excluded from mutation runs (`just mutate` filters `-m "not no_mutation"`). For a test that
    # passes in the real suite but fails only under mutmut's function trampoline, whose wrapping of
    # async generators perturbs `aclose()`/`finally` finalization timing. Use sparingly.
    "no_mutation: skipped under mutmut; a trampoline-instrumentation artifact, not a real failure",
    # Pass the gap the test closes as the first argument, and any CVE via `cve=`, e.g.
    # `@pytest.mark.security("strips credentials on a cross-origin redirect", cve="CVE-...")`.
    # `packages/conftest.py` enforces that every security-marked test carries a description.
    "security: exercises a security invariant; first arg names the gap it closes (see the note in pyproject)",
]

# Turn warnings into failures, then carve out narrow exceptions. Later entries win,
# so the `ignore` overrides the blanket `error` for the one case it matches.
filterwarnings = [
    "error",
    # uvloop's `run_in_executor` calls the deprecated `asyncio.iscoroutinefunction`
    # (stdlib, slated for removal in 3.16), so any test that hits `asyncio.to_thread`
    # under the uvloop loop would otherwise fail. This is uvloop's call to make, not ours.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # pytest-durations still reads the pytest-10-deprecated `FixtureDef.has_location`
    # to key its fixture measurements. Its timing report is a dev tool, not production
    # behaviour, so ignore its deprecation rather than let it fail the suite.
    "ignore:FixtureDef.has_location is deprecated:pytest.PytestRemovedIn10Warning",
    # starlette's TestClient now prefers `httpx2` and warns when it finds only `httpx`.
    # The interop test that drives a `without` app through TestClient is about TestClient,
    # not about which httpx major backs it, so it runs on the httpx already in the tree
    # rather than pulling in a second HTTP client for one test.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = [
    # Imperative benchmark shells, exercised by actually running a benchmark rather
    # than unit-tested, per functional-core/imperative-shell: the process-launch and
    # orchestration modules (they spawn the server, vegeta, and austin as
    # subprocesses) and the run-by-hand result-analysis CLIs (plot, hotspots), which
    # read `results/` and render/print. Their pure cores (e.g. hotspots' frame
    # classifier) are still unit-tested directly; only the CLI shell is uncovered.
    "*/benchmarks/todos/servers.py",
    "*/benchmarks/harness.py",
    "*/benchmarks/plot.py",
    "*/benchmarks/hotspots.py",
    # The store-backed half of the durable-workflow toy and the tests that drive it,
    # omitted only when the run *cannot* cover them. Coverage substitutes `${VAR-default}` from
    # the environment as it reads this file, and the `test` recipe sets
    # WITHOUT_COMPOSE_AVAILABLE once the services in compose.yaml are up: unset, each
    # entry is the bare glob and matches; set, its value prefixes the glob into a
    # pattern that matches nothing, so both files are measured like any other. A run
    # where the compose-marked tests skip (no container engine, as on the macOS and
    # Windows CI legs) then leaves the gate reporting the suite rather than the environment.
    "${WITHOUT_COMPOSE_AVAILABLE-}*/without_durability_redis/*.py",
    "${WITHOUT_COMPOSE_AVAILABLE-}*/without_durability_postgres/*.py",
    "${WITHOUT_COMPOSE_AVAILABLE-}*/tests/test_redis_store.py",
    "${WITHOUT_COMPOSE_AVAILABLE-}*/tests/test_postgres_store.py",
    # The cross-store suite and the doubles it shares, reached only when the servers are
    # up: it is parametrized over every store at once, so one unavailable skips them all.
    "${WITHOUT_COMPOSE_AVAILABLE-}*/tests/durable/test_workflows_over_stores.py",
    "${WITHOUT_COMPOSE_AVAILABLE-}*/tests/durable/stores.py",
    "${WITHOUT_COMPOSE_AVAILABLE-}*/tests/durable/gateways.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
fail_under = 100
exclude_also = [
    "assert_never\\(",
    "case _ as unreachable:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.mypy]
pretty = true
show_error_codes = true

files = ["."]
# `mutants/` is mutmut's per-package copy of the source under mutation; type-checking it
# duplicates every module and just re-checks throwaway mutated code.
exclude = ["site/", "mutants/"]

check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
disallow_any_generics = true

warn_unused_configs = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_redundant_casts = true

ignore_missing_imports = true

plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A",     # https://docs.astral.sh/ruff/rules/#flake8-builtins-a
    "ASYNC", # https://docs.astral.sh/ruff/rules/#flake8-async-async
    "B",     # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "BLE",   # https://docs.astral.sh/ruff/rules/#flake8-blind-except-ble
    "C4",    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "D",     # https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "DTZ",   # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
    "E",     # https://docs.astral.sh/ruff/rules/#error-e
    "F",     # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "FA",    # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
    "FLY",   # https://docs.astral.sh/ruff/rules/#flynt-fly
    "FURB",  # https://docs.astral.sh/ruff/rules/#refurb-furb
    "G",     # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
    "I",     # https://docs.astral.sh/ruff/rules/#isort-i
    "ICN",   # https://docs.astral.sh/ruff/rules/#flake8-import-conventions-icn
    "LOG",   # https://docs.astral.sh/ruff/rules/#flake8-logging-log
    "N",     # https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "PERF",  # https://docs.astral.sh/ruff/rules/#perflint-perf
    "PGH",   # https://docs.astral.sh/ruff/rules/#pygrep-hooks-pgh
    "PIE",   # https://docs.astral.sh/ruff/rules/#flake8-pie-pie
    "PLC",   # https://docs.astral.sh/ruff/rules/#convention-plc
    "PLE",   # https://docs.astral.sh/ruff/rules/#error-ple
    "PLW",   # https://docs.astral.sh/ruff/rules/#warning-plw
    "PT",    # https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
    "PTH",   # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "PYI",   # https://docs.astral.sh/ruff/rules/#flake8-pyi-pyi
    "RET",   # https://docs.astral.sh/ruff/rules/#flake8-return-ret
    "RSE",   # https://docs.astral.sh/ruff/rules/#flake8-raise-rse
    "RUF",   # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "SIM",   # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
    "SLF",   # https://docs.astral.sh/ruff/rules/#flake8-self-slf
    "T10",   # https://docs.astral.sh/ruff/rules/#flake8-debugger-t10
    "T20",   # https://docs.astral.sh/ruff/rules/#flake8-print-t20
    "TID",   # https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
    "UP",    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "W",     # https://docs.astral.sh/ruff/rules/#warning-w
]

ignore = [
    "E501",  # line length exceeds limit
    "E741",  # ambiguous variable name
    "T201",  # print
    "T203",  # pprint
    "N818",  # exception names are deliberately descriptive (ClientDisconnect, TodoNotFound), not Error-suffixed
    "G004",  # logging-f-string: f-strings are the house style for all formatting, including logging calls
    # pydocstyle: enforce well-formed docstrings, but don't mandate their presence or dictate mood.
    "D1",    # undocumented-*: docstrings are written where they add value (and never on modules, per house style)
    "D203",  # incompatible with D211 (no blank line before a class docstring)
    "D205",  # would force a single-physical-line summary; summary sentences here wrap naturally over a few lines
    "D212",  # incompatible with D213 (the multi-line summary belongs on the second line)
    "D401",  # non-imperative-mood: docstrings here are descriptive ("Whether ...", "A ... paired with ...")
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "SLF001",   # tests inspect private internals deliberately (white-box connection-pool checks)
    "ASYNC110", # tests poll observed state (in_flight, started counts) with sleep loops; no Event to await
    "SIM117",   # nested `with` expresses resource scoping (server > pool > request); flattening moves scoped asserts
]
"packages/without-http/src/without_http/client.py" = [
    # `timeout` is a `Timeout` config value threaded to the API boundary (the httpx-parity public name),
    # not a raw seconds deadline; it is applied via `asyncio.timeout` inside `phase`, so ASYNC109's advice is met.
    "ASYNC109",
]
"packages/without-http/src/without_http/testing.py" = [
    "ASYNC109",  # a `Connect` implementation, so it carries `client.py`'s `Timeout` parameter verbatim
]
