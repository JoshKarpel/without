name: Set up toolchain
description: Install uv (with Python) and Just.

inputs:
  python-version:
    description: Python version for uv to install.
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    - name: Install Just
      uses: extractions/setup-just@v4.0.0
    - name: Sync dependencies
      shell: bash
      run: uv sync --locked
