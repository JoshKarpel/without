name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    name: Quality Check
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ["3.14"]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Just
        uses: extractions/setup-just@v4.0.0
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always
      - name: Run type checking and tests
        run: just test --cov -vvv
