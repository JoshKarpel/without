name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.14"

      - name: Build the documentation site
        run: just docs-build

      # Only a default-branch run goes on to deploy, so only it needs the artifact.
      - name: Upload the site artifact
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # Publish only from the default branch; pull requests build to validate but never deploy.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # verify the deployment originates from this workflow
    # Serialize deploys so a newer publish never races a queued one; never cancel one mid-flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
