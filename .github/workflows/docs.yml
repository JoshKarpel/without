name: Docs

# Build the documentation site on pull requests to catch breakage before merge.
# Publishing to GitHub Pages lives in publish-docs.yml, which runs on main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          python-version: "3.14"

      - name: Build the documentation site
        run: just docs-build
