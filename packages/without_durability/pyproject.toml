[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "without-durability"
version = "0.0.0"
description = "Durable workflows for without: a checkpoint any process can read, and the store interfaces that make one writer at a time enforceable."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Josh Karpel", email = "josh.karpel@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "without-async",
    "without-streams",
    "without-dag",
]

[tool.uv.sources]
without-async = { workspace = true }
without-streams = { workspace = true }
without-dag = { workspace = true }
