[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "without-streams"
version = "0.0.0"
description = "The sans-IO stream-processor substrate for without: streams, processors, contexts, and the wiring between them."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Josh Karpel", email = "josh.karpel@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "without-async",
]

[tool.uv.sources]
without-async = { workspace = true }
