# Benchmark tooling that isn't a Python package: the vegeta load generator,
# installed from its GitHub releases via mise's `github` backend. (The sampling
# profiler is Tachyon, in the Python 3.15 stdlib.) The version is pinned for
# reproducibility (a pin bypasses the cooldown below); bump it deliberately.
[tools]
"github:tsenart/vegeta" = "12.13.0"

[settings]
# Skip brand-new releases when resolving any fuzzy version, as supply-chain defense.
minimum_release_age = "7d"
